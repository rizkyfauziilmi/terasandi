services:
  postgres:
    image: postgres:18-alpine
    container_name: terasandi-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terasandi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terasandi}
      POSTGRES_DB: ${POSTGRES_DB:-terasandi}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-terasandi} -d ${POSTGRES_DB:-terasandi}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
