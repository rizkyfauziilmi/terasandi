services:
  postgres:
    image: postgres:18-alpine
    container_name: terasandi-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terasandi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terasandi}
      POSTGRES_DB: ${POSTGRES_DB:-terasandi}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-terasandi} -d ${POSTGRES_DB:-terasandi}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: terasandi-api-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terasandi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terasandi-dev-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private bucket, then exits. MinIO itself does not.
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    container_name: terasandi-api-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terasandi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terasandi-dev-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-terasandi-files}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"

volumes:
  postgres_data:
  minio_data:
