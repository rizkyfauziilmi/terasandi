packages:
  - api
  - web
  - packages/*

allowBuilds:
  '@nestjs/authentication': true
  sharp: false
  unrs-resolver: false

permissions:
  '@nestjs/authentication':
    skills: true
  drizzle-kit:
    skills: true

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
